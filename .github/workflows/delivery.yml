name: Test, build and deploy Healthnote
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: health-diary-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: health_diary_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test backend
        run: |
          python -m pip install psycopg2-binary==2.9.10
          python -m unittest discover -s backend/tests -v
          python backend/tests/integration.py
        env:
          TEST_DATABASE_DSN: postgresql://postgres:ci-only-password@127.0.0.1:5432/health_diary_ci
      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run check:ui
          npm run build
      - name: Package this commit
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python -c 'import json,os; json.dump({"sha":os.environ["RELEASE_SHA"]},open("release.json","w"))'
          tar -czf health-diary.tgz release.json backend/model.py backend/server.py backend/schema.sql frontend/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-diary-${{ github.sha }}
          path: health-diary.tgz
          retention-days: 14
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: health-diary-${{ github.sha }}
      - name: Install tested release over restricted SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$RUNNER_TEMP/health-diary-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/health-diary-ssh/key"
          chmod 600 "$RUNNER_TEMP/health-diary-ssh/key"
          trap 'rm -f "$RUNNER_TEMP/health-diary-ssh/key"' EXIT
          ssh -i "$RUNNER_TEMP/health-diary-ssh/key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=ops/known_hosts -o ConnectTimeout=15 health-deploy@212.80.219.97 < health-diary.tgz
      - name: Verify public HTTPS
        run: |
          curl --fail --silent --show-error --retry 4 https://healthnote-bot.duckdns.org:8443/api/health
          curl --fail --silent --show-error https://healthnote-bot.duckdns.org:8443/ > /dev/null
