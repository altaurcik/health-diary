limit_req_zone $binary_remote_addr zone=health_diary_api:1m rate=5r/s;
server {
    listen 80;
    server_name healthnote-bot.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/health-diary-acme; }
    location / { return 302 https://healthnote-bot.duckdns.org:8443$request_uri; }
}
server {
    listen 8443 ssl;
    server_name healthnote-bot.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/healthnote-bot.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/healthnote-bot.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/health-diary/current/frontend/dist;
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://t.me; base-uri 'self'; object-src 'none'" always;
    access_log off;
    location /api/ {
        limit_req zone=health_diary_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri /index.html; expires -1; }
}
